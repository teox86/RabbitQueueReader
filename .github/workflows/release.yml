name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "${{ steps.ver.outputs.version }} — RabbitMQ Stream Viewer"
          body: |
            ## RabbitMQ Stream Viewer ${{ steps.ver.outputs.version }}

            Read-only web viewer for RabbitMQ queues (including stream queues).

            ### Features
            - Zero dependencies — Python 3.8+ stdlib only, nothing to install
            - Dark-themed browser UI at `http://127.0.0.1:8765`
            - Peek messages with `requeue=true` — **nothing is ever deleted or modified**
            - Browse all queues, filter messages, auto-refresh, export to JSON
            - Double-click launchers: `start.bat` (Windows), `start.sh` (macOS/Linux)

            ### Quick start
            1. Enable the RabbitMQ Management Plugin:
               ```
               rabbitmq-plugins enable rabbitmq_management
               ```
            2. Double-click `start.bat` (Windows) or `start.sh` (macOS/Linux)
            3. Browser opens automatically — fill in host, port, credentials, queue name and click **Load Messages**
          files: |
            app.py
            start.bat
            start.sh
            README.md
          draft: false
          prerelease: false
