name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. v2.0.0). Leave blank to auto-increment.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to read existing tags

      - name: Compute next version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the latest semver tag (vMAJOR.MINOR.PATCH)
          LATEST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)

          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            # Strip leading 'v', split on '.', bump patch
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            PATCH=$(( PATCH + 1 ))
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${LATEST:-none}  →  Next: $NEXT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "${{ steps.ver.outputs.version }} — RabbitMQ Stream Viewer"
          body: |
            ## RabbitMQ Stream Viewer ${{ steps.ver.outputs.version }}

            Read-only web viewer for RabbitMQ queues (including stream queues).

            ### Features
            - Zero dependencies — Python 3.8+ stdlib only, nothing to install
            - Dark-themed browser UI at `http://127.0.0.1:8765`
            - Peek messages with `ackmode=ack_requeue_true` — **nothing is ever deleted or modified**
            - Browse all queues, filter messages, auto-refresh, export to JSON
            - Double-click launchers: `start.bat` (Windows), `start.sh` (macOS/Linux)

            ### Quick start
            1. Enable the RabbitMQ Management Plugin:
               ```
               rabbitmq-plugins enable rabbitmq_management
               ```
            2. Double-click `start.bat` (Windows) or `start.sh` (macOS/Linux)
            3. Browser opens automatically — fill in host, port, credentials, queue name and click **Load Messages**
          files: |
            app.py
            start.bat
            start.sh
            README.md
          draft: false
          prerelease: false
